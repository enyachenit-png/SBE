<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBE — Diagnostic flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1B3A;
  --ink-soft:#1B2952;
  --gold:#B8954A;
  --gold-soft:#D4B574;
  --cream:#FAF6EC;
  --paper:#FFFFFF;
  --text:#1F2330;
  --muted:#6B6F7A;
  --rule:#E5DFCF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--cream);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}
body{display:flex;flex-direction:column;align-items:center;padding:0;overflow-x:hidden;}

.topbar{position:sticky;top:0;width:100%;background:rgba(250,246,236,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding:14px 20px;display:flex;align-items:center;gap:14px;z-index:100;}
.brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.3px;}
.brand span{color:var(--gold);}
.progress-wrap{flex:1;height:4px;background:var(--rule);border-radius:100px;overflow:hidden;max-width:280px;}
.progress-bar{height:100%;background:var(--gold);width:0%;transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:100px;}
.step-count{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0.5px;min-width:48px;text-align:right;}

.container{width:100%;max-width:680px;padding:32px 22px 80px;display:flex;flex-direction:column;min-height:calc(100vh - 60px);}

.intro{text-align:center;padding:40px 0 20px;}
.intro .kicker{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;}
.intro h1{font-family:'Cormorant Garamond',serif;font-size:42px;line-height:1.05;font-weight:700;color:var(--ink);letter-spacing:-1px;margin-bottom:16px;}
.intro h1 em{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-weight:500;}
.intro .lead{font-size:16px;line-height:1.6;color:var(--muted);max-width:480px;margin:0 auto 36px;}
.intro .meta{display:flex;justify-content:center;gap:24px;margin-bottom:40px;font-size:13px;color:var(--ink-soft);}
.intro .meta span{display:flex;align-items:center;gap:6px;}

.q-screen{animation:fadeIn .5s cubic-bezier(.4,0,.2,1);}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.q-num{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;}
.q-title{font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1.15;font-weight:700;color:var(--ink);letter-spacing:-0.5px;margin-bottom:8px;}
.q-subtitle{font-size:14px;color:var(--muted);margin-bottom:14px;font-style:italic;}
.q-hint{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:0.3px;margin-bottom:20px;display:flex;align-items:center;gap:6px;background:rgba(184,149,74,0.08);padding:8px 14px;border-radius:8px;width:fit-content;}

.options{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;}
.option{background:var(--paper);border:1.5px solid var(--rule);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);text-align:left;font-family:inherit;font-size:15px;line-height:1.4;color:var(--text);}
.option:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 6px 20px rgba(184,149,74,0.12);}
.option.selected{border-color:var(--gold);background:linear-gradient(135deg, #FFFDF7 0%, var(--paper) 100%);box-shadow:0 6px 24px rgba(184,149,74,0.18);}
.option-icon{font-size:24px;flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--cream);border-radius:10px;position:relative;}
.option.selected .option-icon{background:linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);}
.option.multi.selected .option-icon::after{content:"✓";position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:var(--ink);border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Inter',sans-serif;}
.option-text{flex:1;font-weight:500;}

.btn-row{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.btn{font-family:inherit;border:none;cursor:pointer;font-weight:600;letter-spacing:0.3px;transition:all .2s;font-size:14px;display:flex;align-items:center;gap:8px;}
.btn-back{background:transparent;color:var(--muted);padding:12px 0;}
.btn-back:hover{color:var(--ink);}
.btn-back:disabled{opacity:0.3;cursor:not-allowed;}
.btn-primary{background:var(--ink);color:var(--paper);padding:14px 28px;border-radius:100px;font-size:14px;letter-spacing:0.5px;text-transform:uppercase;}
.btn-primary:hover{background:var(--gold);transform:translateY(-1px);box-shadow:0 6px 20px rgba(14,27,58,0.2);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

.result{animation:fadeIn .6s cubic-bezier(.4,0,.2,1);padding-top:12px;}
.result-kicker{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:4px;text-transform:uppercase;margin-bottom:14px;text-align:center;}
.result-title{font-family:'Cormorant Garamond',serif;font-size:38px;line-height:1.05;font-weight:700;color:var(--ink);letter-spacing:-1px;margin-bottom:6px;text-align:center;}
.result-title em{font-style:italic;color:var(--gold);font-weight:500;}
.result-divider{width:60px;height:2px;background:var(--gold);margin:28px auto;}

.block{margin-bottom:32px;}
.block-label{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px;}
.block-text{font-size:16.5px;line-height:1.65;color:var(--text);font-weight:400;}
.block-text strong{color:var(--ink);font-weight:600;}
.block-text em{font-style:italic;color:var(--ink-soft);}
.block-quote{background:var(--paper);border-left:3px solid var(--gold);padding:18px 22px;border-radius:0 12px 12px 0;font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;color:var(--ink);font-style:italic;font-weight:500;}

.cost-block{background:linear-gradient(135deg,rgba(184,149,74,0.06),rgba(250,246,236,0.3));border-left:3px solid var(--ink-soft);padding:20px 22px;border-radius:0 14px 14px 0;margin-bottom:32px;}
.cost-block .block-label{color:var(--ink-soft);}
.cost-block .block-text{font-size:15.5px;color:var(--ink-soft);font-style:italic;line-height:1.6;}

.cta-block{margin-top:48px;padding:40px 30px;background:linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 100%);border-radius:18px;color:var(--paper);text-align:center;position:relative;overflow:hidden;}
.cta-block::before{content:"";position:absolute;top:-50%;right:-30%;width:300px;height:300px;background:radial-gradient(circle, rgba(184,149,74,0.15) 0%, transparent 70%);}
.cta-kicker{position:relative;font-size:11px;font-weight:600;color:var(--gold-soft);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;}
.cta-title{position:relative;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.15;font-weight:700;margin-bottom:10px;}
.cta-title em{font-style:italic;color:var(--gold-soft);}
.cta-sub{position:relative;font-size:14px;color:rgba(255,255,255,0.72);margin-bottom:28px;line-height:1.55;max-width:400px;margin-left:auto;margin-right:auto;}
.cta-sub strong{color:var(--gold-soft);}
.cta-btn{position:relative;background:var(--gold);color:var(--ink);padding:16px 32px;border-radius:100px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;font-size:13px;border:none;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:10px;}
.cta-btn:hover{background:var(--paper);transform:translateY(-1px);box-shadow:0 8px 24px rgba(184,149,74,0.3);}

.restart{margin-top:32px;text-align:center;}
.restart a{color:var(--muted);text-decoration:none;font-size:13px;border-bottom:1px solid var(--rule);padding-bottom:2px;cursor:pointer;}
.restart a:hover{color:var(--ink);border-color:var(--ink);}

@media(max-width:480px){
  .intro h1{font-size:34px;}
  .q-title{font-size:24px;}
  .result-title{font-size:30px;}
  .option{padding:16px 18px;font-size:14px;}
  .option-icon{width:36px;height:36px;font-size:20px;}
  .container{padding:24px 18px 80px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">SBE <span>·</span> Diagnostic</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="step-count" id="stepCount"></div>
</div>

<div class="container" id="app"></div>

<script>
const QUESTIONS = [
  {

const PROFILES = {
  1:{

    title:"L'Étudiant <em>Sous Pression</em>",
    intro:"Tu es capable — vraiment. Mais tu travailles à l'envers de comment fonctionne ton cerveau. Tu accumules, tu remets à plus tard, puis tu te retrouves à tout absorber dans l'urgence. Et tu te demandes pourquoi le stress est aussi violent la veille des examens.",
    mean:"Ton cerveau n'a jamais eu le temps d'ancrer vraiment ce que tu as appris. Tu as des informations en mémoire à court terme — elles suffisent pour tenir quelques jours, puis elles s'effacent. <strong>Ce n'est pas un problème de capacité. C'est un problème de timing.</strong>",
    real:"Ton vrai problème n'est pas le manque de travail. C'est que tu travailles en une fois ce qui aurait dû être réparti sur trois semaines. <em>Et aucune quantité d'heures la veille ne peut compenser ce que le temps seul peut construire.</em>",
    arche:"ARCHE est construite exactement pour transformer ce schéma. L'étape <strong>C — Consolider</strong> t'apprend à répartir ton apprentissage en petites sessions quotidiennes de 30 minutes qui valent infiniment plus que 5 heures d'un coup. L'étape <strong>H — Habituer</strong> te donne un planning réaliste adapté à tes vraies contraintes — pas un planning idéal que tu ne suivras jamais. Et la dimension psychologique d'ARCHE s'attaque directement à la mécanique du stress : quand tu as construit quelque chose de solide semaine après semaine, il n'y a plus rien à paniquer. <strong>ARCHE est la seule méthode qui s'attaque simultanément au timing, au planning et à la psychologie — les trois racines exactes de ton profil.</strong>",
    cost:"Sans changement de structure, le prochain semestre reproduit exactement ce cycle. L'urgence s'aggrave chaque année — les cours deviennent plus denses, les enjeux plus élevés. Le bourrage de la veille ne s'améliore pas avec le temps. Il s'épuise.",
    quote:"Valider ton année, retrouver de la sérénité avant les examens — et travailler moins longtemps."
  },
  2:{
    name:"Le Travailleur Inefficace",

    intro:"Tu travailles. Vraiment. Tu passes du temps sur tes cours, tu t'y mets sérieusement — et pourtant les résultats ne sont pas à la hauteur de l'effort fourni. C'est l'une des situations les plus frustrantes qui soit : sentir qu'on fait ce qu'il faut sans que ça paie.",
    mean:"Tu travailles beaucoup mais pas de la bonne façon. La relecture, le surlignage, la recopie — ce sont des méthodes qui donnent l'illusion d'apprendre. Ton cerveau <strong>reconnaît</strong> l'information quand il la revoit — mais il est incapable de la <strong>restituer</strong> seul face à une feuille blanche. Ce n'est pas la même chose.",

    cost:"Continuer à relire est une illusion de productivité qui s'aggrave avec la densité des cours. Plus les programmes seront chargés, plus l'écart entre l'effort fourni et les résultats obtenus sera douloureux — et incompréhensible.",
    quote:"Travailler moins. Retenir mieux. Optimiser chaque heure investie."
  },
  3:{
    name:"Le Distrait Chronique",
    title:"Le <em>Distrait</em> Chronique",

    mean:"Ton cerveau est câblé pour la stimulation immédiate — et le travail scolaire ne peut pas rivaliser avec les réseaux sociaux en termes de dopamine. <strong>Ce n'est pas une question de volonté. C'est de la biologie.</strong> Mais ça se gère — avec les bons outils.",

  6:{

function determineProfile(s){
  const douleurs = Array.isArray(s.DOULEUR) ? s.DOULEUR : (s.DOULEUR ? [s.DOULEUR] : []);
  const objectifs = Array.isArray(s.OBJECTIF) ? s.OBJECTIF : (s.OBJECTIF ? [s.OBJECTIF] : []);
  const has = (arr, ...vals) => vals.some(v => arr.includes(v));

  if(s.MATURITE==='avancé' && has(objectifs,'optimisation','progression') && !has(douleurs,'stress','distraction')) return 6;
  if(['avancé','intermédiaire'].includes(s.MATURITE) && has(douleurs,'rétention') && has(objectifs,'optimisation')) return 2;
  if(['urgence','procrastinateur'].includes(s.MATURITE) && has(douleurs,'stress','volume')) return 1;
  if(has(douleurs,'distraction') && (s.CANAL==='auditif' || s.CHRONO==='variable')) return 3;
  if(s.CANAL==='visuel-spatial' && has(douleurs,'rétention')) return 7;
  if(s.MATURITE==='débutant' && has(objectifs,'méthode')) return 4;
  if(has(douleurs,'stress') || has(objectifs,'stress')) return 5;
  if(s.CANAL==='auditif') return 8;
  if(['urgence','procrastinateur'].includes(s.MATURITE)) return 1;
  return 4;
}

let state = {};
let currentQ = -1;
let answers = {};
let multiAnswers = {};

const app = document.getElementById('app');
const progressBar = document.getElementById('progressBar');
const stepCount = document.getElementById('stepCount');

function updateProgress(){
  if(currentQ === -1){
    progressBar.style.width = '0%';
    stepCount.textContent = '';
  } else if(currentQ >= QUESTIONS.length){
    progressBar.style.width = '100%';
    stepCount.textContent = '✓ terminé';
  } else {
    const pct = ((currentQ) / QUESTIONS.length) * 100;
    progressBar.style.width = pct + '%';
    stepCount.textContent = `${currentQ + 1} / ${QUESTIONS.length}`;
  }
}

function renderIntro(){
  app.innerHTML = `
    <div class="intro">
      <div class="kicker">Diagnostic SBE</div>
      <h1>Découvre <em>ton profil</em><br>d'apprentissage</h1>
      <p class="lead">6 questions. 2 minutes. Un diagnostic personnalisé construit à partir de la méthode ARCHE — pour comprendre <em>pourquoi</em> ta façon de travailler ne te donne pas les résultats que tu mérites.</p>
      <div class="meta">
        <span>⏱ 2 min</span>
        <span>•</span>
        <span>📋 6 questions</span>
        <span>•</span>
        <span>🎯 8 profils</span>
      </div>
      <button class="btn btn-primary" onclick="start()">Commencer mon diagnostic →</button>
    </div>
  `;
  updateProgress();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  let optsHtml;

  if(q.multi){
    const sel = multiAnswers[q.num] || [];
    optsHtml = q.options.map((o,i)=>`
      <button class="option multi ${sel.includes(i)?'selected':''}" onclick="toggleMulti(${i})">
        <span class="option-icon">${o.icon}</span>
        <span class="option-text">${o.text}</span>
      </button>
    `).join('');
  } else {
    const selected = answers[q.num];
    optsHtml = q.options.map((o,i)=>`
      <button class="option ${selected===i?'selected':''}" onclick="selectSingle(${i})">
        <span class="option-icon">${o.icon}</span>
        <span class="option-text">${o.text}</span>
      </button>
    `).join('');
  }

  const canNext = q.multi
    ? (multiAnswers[q.num]||[]).length > 0
    : answers[q.num] !== undefined;

  const hint = q.multi
    ? `<div class="q-hint">✦ Plusieurs réponses possibles</div>`
    : '';

  app.innerHTML = `
    <div class="q-screen">
      <div class="q-num">Question ${q.num} / ${QUESTIONS.length}</div>
      <h2 class="q-title">${q.title}</h2>
      <p class="q-subtitle">${q.sub}</p>
      ${hint}
      <div class="options">${optsHtml}</div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="back()" ${currentQ===0?'disabled':''}>← Précédent</button>
        <button class="btn btn-primary" onclick="nextQ()" ${canNext?'':'disabled'}>${currentQ===QUESTIONS.length-1?'Voir mon profil ✨':'Suivant →'}</button>
      </div>
    </div>
  `;
  updateProgress();
}

function renderResult(){
  const profileId = determineProfile(state);
  const p = PROFILES[profileId];
  app.innerHTML = `
    <div class="result">
      <div class="result-kicker">Ton profil d'apprentissage</div>
      <h1 class="result-title">${p.title}</h1>
      <div class="result-divider"></div>

      <div class="block">
        <p class="block-text">${p.intro}</p>
      </div>

      <div class="block">
        <div class="block-label">Ce que ça veut dire concrètement</div>
        <p class="block-text">${p.mean}</p>
      </div>

      <div class="block">
        <div class="block-label">Ton vrai problème</div>
        <p class="block-text">${p.real}</p>
      </div>

      <div class="block">
        <div class="block-label">Pourquoi la méthode ARCHE est indispensable pour toi</div>
        <p class="block-text">${p.arche}</p>
      </div>

      <div class="cost-block">
        <div class="block-label">Ce qui se passe si tu ne changes rien</div>
        <p class="block-text">${p.cost}</p>
      </div>

      <div class="block">
        <div class="block-quote">"${p.quote}"</div>
      </div>

      <div class="cta-block">
        <div class="cta-kicker">La méthode ARCHE — conçue pour ton profil exact</div>
        <h3 class="cta-title">Ce diagnostic n'est<br><em>que le début.</em></h3>
        <p class="cta-sub">ARCHE n'est pas un conseil de plus. C'est un système qui répond spécifiquement à ce que <strong>toi</strong> tu vis — ton canal mémoriel, ton chronotype, tes blocages. Ton parcours personnalisé t'attend.</p>
        <button class="cta-btn" onclick="alert('→ Redirection vers création de compte SBE Hub')">Démarrer la méthode ARCHE →</button>
      </div>

      <div class="restart">
        <a onclick="restart()">↺ Recommencer le diagnostic</a>
      </div>
    </div>
  `;
  updateProgress();
}

function start(){ currentQ = 0; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }

function selectSingle(i){
  const q = QUESTIONS[currentQ];
  answers[q.num] = i;
  state[q.var] = q.options[i].value;
  renderQuestion();
}

function toggleMulti(i){
  const q = QUESTIONS[currentQ];
  if(!multiAnswers[q.num]) multiAnswers[q.num] = [];
  const arr = multiAnswers[q.num];
  const idx = arr.indexOf(i);
  if(idx >= 0) arr.splice(idx,1); else arr.push(i);
  state[q.var] = arr.map(j=>q.options[j].value);
  renderQuestion();
}

function nextQ(){
  const q = QUESTIONS[currentQ];
  const canNext = q.multi
    ? (multiAnswers[q.num]||[]).length > 0
    : answers[q.num] !== undefined;
  if(!canNext) return;
  if(currentQ < QUESTIONS.length - 1){
    currentQ++;
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    currentQ = QUESTIONS.length;
    renderResult();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function back(){
  if(currentQ === 0) return;
  if(currentQ === QUESTIONS.length){ currentQ = QUESTIONS.length - 1; }
  else { currentQ--; }
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  state = {}; answers = {}; multiAnswers = {}; currentQ = -1;
  renderIntro();
  window.scrollTo({top:0,behavior:'smooth'});
}

renderIntro();
</script>
